<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b16" />
    <title>Typeforge: Realm Run</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <noscript>
      <p class="no-script-message">
        Typeforge needs JavaScript to run the typing duel. Please enable
        JavaScript and reload.
      </p>
    </noscript>
    <main class="app-shell">
      <section class="map-screen" id="mapScreen" aria-labelledby="gameTitle">
        <header class="game-header">
          <div>
            <p class="eyebrow">Type-O-Mancer</p>
            <h1 class="game-title">Realm Run</h1>
            <p class="subtitle">
              Race every guardian. Type fast, stay accurate, and master the map.
            </p>
          </div>
        </header>
        <section class="loadout" aria-label="Battle settings">
          <div class="loadout-item">
            <span class="loadout-kicker">HERO LOADOUT</span>
            <strong>Choose your difficulty</strong>
          </div>
          <div
            class="difficulty-selector"
            role="radiogroup"
            aria-label="Difficulty"
          >
            <button
              class="difficulty active"
              data-difficulty="easy"
              type="button"
              role="radio"
              aria-checked="true"
            >
              <span>Explorer</span>
              <small>Slower, less precise rival</small>
            </button>
            <button
              class="difficulty"
              data-difficulty="medium"
              type="button"
              role="radio"
              aria-checked="false"
            >
              <span>Knight</span>
              <small>Balanced experience</small>
            </button>
            <button
              class="difficulty"
              data-difficulty="hard"
              type="button"
              role="radio"
              aria-checked="false"
            >
              <span>Legend</span>
              <small>Faster, more precise rival</small>
            </button>
          </div>
        </section>
        <section class="map-card" aria-label="Campaign map">
          <div class="map-intro">
            <div>
              <span class="map-kicker">CAMPAIGN MAP</span>
              <h2>The Five Realms</h2>
            </div>
            <p id="progressText"></p>
          </div>
          <div class="world-map" id="worldMap" aria-live="polite"></div>
          <p class="map-hint">
            Hidden enemies lurk in the shadows. Grey marks: defeated guardians.
          </p>
        </section>
      </section>
      <section
        class="battle-screen"
        id="battleScreen"
        hidden
        aria-live="polite"
      >
        <header class="battle-topbar">
          <div class="battle-location">
            <span id="regionName"></span><strong id="stageName"></strong>
          </div>
        </header>
        <div class="fighter-label enemy-label">
          <span>GUARDIAN</span><strong id="enemyName"></strong>
        </div>
      </section>
    </main>
    <script src="campaign-data.js"></script>
    <script src="map-renderer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
